services:
  # An Iceberg REST catalog with its warehouse on the local file system. DuckDB runs on
  # the host and writes data files under the paths the catalog hands out, so the
  # warehouse is mounted at the same absolute path it has on the host.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest@sha256:009f9f6897cc1e8fd6e8133c401c7a3e7c333c71293a621d06a71570ae989c29
    environment:
      CATALOG_WAREHOUSE: "file://${ICEBERG_WAREHOUSE:?set ICEBERG_WAREHOUSE to an absolute path}"
      # The image puts this directory on the classpath, which is how its core-site.xml
      # reaches Hadoop. It makes what the catalog creates writable by DuckDB's user.
      LOG_CONFIG_DIR: /etc/iceberg-rest
    volumes:
      - "${ICEBERG_WAREHOUSE}:${ICEBERG_WAREHOUSE}"
      - "./test/support/iceberg-rest:/etc/iceberg-rest:ro"
    ports:
      - "18181:8181"

  # A GCS emulator for the checkpoint tests, with every object in memory. The bucket is
  # created by the tests.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "localhost:14443"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4443/storage/v1/b"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "14443:4443"
